name: Coverage Check

on:
  push:
    branches:
      - main

jobs:
  coverage:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install pytest

      - name: Run coverage
        run: |
          pytest --cov=. --cov-report=term